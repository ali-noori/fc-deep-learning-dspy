fc_deep:
  local_dataset:
    train: "mnist.npz"
    test: "mnist.npz"
    central_test: null
    detail: {}

  centralized: True

  logic:
    mode: "file"
    dir: "."

  result:
    pred: "y_pred.csv"
    target: "y_test.csv"
    model: "model.pt"

  fed_hyper_params:
    max_iter: 1
    n_classes: 10
    federated_model: 'FedAvg.py'
    global_updates: WEIGHTS_STOPPING
    param: {}

  use_smpc: False

  trainer:
    name: 'FedMMb.py'
    param: {}
    local_updates: WEIGHTS_N_SAMPLES
    data_loader: ImageLoader.py
    optimizer:
      name: 'SGD'
      param:
        lr: 0.1
    loss:
      name: 'CrossEntropyLoss'
      param: {}
    metrics:
      - name: 'Accuracy'
        package: 'torchmetrics.classification'
        param:
          task: 'multiclass'
          num_classes: 10

  train_config:
    verbose: False
    batch_size: 32
    test_batch_size: 32
    epochs: 1
    lr: 0.1
    batch_count: 1
    device: cpu

  model:
    name: 'cnn.py'
    n_classes: 10
    in_features: 1
