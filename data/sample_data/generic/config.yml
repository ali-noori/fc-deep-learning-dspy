# OLD: `fed_hyper_params` had `federated_model: 'FedAVG'` and no `global_updates`; `train_config` held
# `data_loader` / loss / optimizer. The running app expects `trainer` + `fed_hyper_params.global_updates`.
# NEW: Same layout as repo root `config.yml` / `mnist/generic` sample (see comments there).

fc_deep:
  local_dataset:
    train: "train.npz"
    test: "test.npz"
    central_test: null
    detail: {}

  logic:
    mode: "directory"
    dir: "data"

  result:
    pred: "y_pred.csv"
    target: "y_test.csv"
    model: "model.pt"

  fed_hyper_params:
    max_iter: 10
    n_classes: 10
    # OLD: federated_model: 'FedAVG'
    # NEW: Built-in `FedAvg` in `utils/pytorch/optimizer.py`.
    federated_model: "FedAvg"
    global_updates: WEIGHTS_STOPPING
    param: {}

  use_smpc: false

  trainer:
    name: "BasicTrainer"
    param: {}
    local_updates: WEIGHTS_N_SAMPLES
    # NEW: Built-in `ImageLoader` in `utils/pytorch/DataLoader.py` (this folder has no `ImageLoader.py`).
    # OLD: data_loader: ImageLoader.py
    data_loader: "ImageLoader"
    optimizer:
      name: "SGD"
      param:
        lr: 0.1
    loss:
      name: "CrossEntropyLoss"
      param: {}
    metrics:
      - name: "Accuracy"
        package: "torchmetrics.classification"
        param:
          task: "multiclass"
          num_classes: 10

  train_config:
    verbose: false
    batch_size: 32
    test_batch_size: 32
    epochs: 1
    lr: 0.1
    batch_count: 1
    device: cpu

  model:
    name: "cnn.py"
    n_classes: 10
    in_features: 1
