# OLD: `data_loader`, `optimizer`, and `loss` lived under `train_config`; the app never read them
# (see `utils/pytorch/states.py` → `get_custom_modules` / `get_dataloader`, which use `config['trainer']`).
# OLD: Missing `trainer`, `fed_hyper_params.global_updates` → KeyError: 'trainer' at runtime.
#
# NEW: Align with `config.yml` at repo root so Initialization finds `trainer` and federated keys.

fc_deep:
  local_dataset:
    train: "train.npz"
    test: "test.npz"
    central_test: null
    detail: {}

  logic:
    mode: "directory"
    dir: "data"

  result:
    pred: "y_pred.csv"
    target: "y_test.csv"
    model: "model.pt"

  fed_hyper_params:
    max_iter: 10
    n_classes: 10
    # OLD: federated_model: "FedAvg.py"
    # NEW: Built-in class `FedAvg` in `utils/pytorch/optimizer.py` (no file on `mnt/input`).
    federated_model: "FedAvg"
    global_updates: WEIGHTS_STOPPING
    param: {}

  use_smpc: false

  trainer:
    # NEW: Use built-in `BasicTrainer` so no extra `FedMMb.py` is required on `mnt/input`.
    # OLD: name: 'FedMMB.py'
    name: "BasicTrainer"
    param: {}
    # OLD: root `config.yml` used `local_update` (singular) but code expects `local_updates`.
    local_updates: WEIGHTS_N_SAMPLES
    data_loader: "ImageLoader.py"
    optimizer:
      name: "SGD"
      param:
        lr: 0.1
    loss:
      name: "CrossEntropyLoss"
      param: {}
    metrics:
      - name: "Accuracy"
        package: "torchmetrics.classification"
        param:
          task: "multiclass"
          num_classes: 10

  train_config:
    verbose: false
    batch_size: 32
    test_batch_size: 32
    epochs: 1
    lr: 0.1
    batch_count: 1
    device: cpu

  model:
    name: "cnn.py"
    n_classes: 10
    in_features: 1
