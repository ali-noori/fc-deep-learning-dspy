# =============================================================================
# Deep guide: config.maximum.yml (fc_deep FeatureCloud app)
# =============================================================================
# This file is documentation ONLY. The app reads mnt/input/config.yml (or your
# test config), not this file.
#
# How to read this doc:
#   - Under fc_deep.<section>.<parameter> you get: what it does, how the code
#     uses it, what changes when you pick different values, and pitfalls.
#   - Cross-field rules: CONFIG_INCOMPATIBILITIES.md (keep it open).
#
# Config loading path (simplified):
#   CustomStates/ConfigState.py  → read_config(), finalize_config() (paths, splits)
#   utils/pytorch/states.py      → Initialization.run() (data, model, schemas)
# =============================================================================

_meta:
  companion_template: config.maximum.yml
  related_docs:
    - CONFIG_INCOMPATIBILITIES.md
    - CustomStates/ConfigState.py
    - utils/pytorch/states.py
    - utils/pytorch/utils.py  # LocalUpdates, GlobalUpdates enums

introduction:
  what_fc_deep_block_is: |
    The YAML block under the app name (e.g. fc_deep) is the single source of truth
    for: where data lives, how many folds/clients you simulate, how local training
    works (optimizer, loss, metrics), which neural net is built, and how the
    coordinator aggregates updates over global rounds.

  execution_branches: |
    After Initialization, the app follows ONE main style:
    (A) If fc_deep.simulation is non-null → "Simulation" state machine in states.py
        (multi-client-in-one-process style; not the standard FC multi-container loop).
    (B) Else normal init → then if fc_deep.centralized is set → "Centralized" path
        (all local data trained in one process; coordinator still handles central_test).
    (C) Else → standard federated LocalUpdate / GlobalAggregation loop.

    Important: simulation is checked FIRST; if set, centralized is not used in the
    same way as a normal federated run. See CONFIG_INCOMPATIBILITIES §1.

fc_deep:
  # ---------------------------------------------------------------------------
  # local_dataset — filenames + loader kwargs
  # ---------------------------------------------------------------------------
  local_dataset:
    section_role: |
      Declares the *basenames* of input files (train, test, optional central test,
      optional init weights) and passes **detail** into the dataloader constructor.

    how_paths_are_built: |
      ConfigState.finalize_config() walks every key under local_dataset and builds
      input_files[key] = list of paths, one per split: "<split_dir>/<value>".
      So each *file* key must be a STRING filename (e.g. train.npz).
      The **detail** key is special: its value is a dict (sep, label, ...). The loop
      still creates a synthetic "path" for detail, but real loading uses detail only
      as **kwargs** to the dataloader class (see Initialization.get_dataloader).
      Do not add random extra keys under local_dataset unless they are real files.

    train:
      description: "Training file basename inside each split directory."
      code_uses: |
        Initialization.run() uses input_files['train'][0] only to infer sample
        shape and construct the dataloader class; then every fold gets
        dl.load(train_path, batch_size).
      when_you_change_it: |
        Must match files you actually ship under each fold (directory mode) or under
        input_dir (file mode). Wrong extension vs trainer.data_loader → load error.
      examples:
        - "train.npz  # typical for ImageLoader / numpy"
        - "train.csv  # with RnaLoader.py + detail.sep / detail.label"

    test:
      description: "Test / validation file basename per split."
      code_uses: "Paired with train per fold; required — init errors if no test and no central_test."
      when_you_change_it: "Same constraints as train; must exist per split."

    central_test:
      description: "Optional global eval set (often on coordinator only)."
      code_uses: |
        If non-null, coordinator builds test_loader from input_files['central_test']
        and can run central evaluation / write central outputs. Participants may
        keep test_loader None — see CONFIG_INCOMPATIBILITIES §9.
      typical_values:
        - "mnist.npz  # shared holdout file name"
        - "null  # disable central test (common in minimal configs)"
      when_you_change_it: |
        null: skip central test loader path on coordinator.
        Set: coordinator must find that file; metrics/paths for central results must align.

    detail:
      description: "Keyword arguments passed to the dataloader constructor."
      code_uses: "dl_class(sample_path, **local_dataset['detail']) in get_dataloader."
      examples:
        image_loader: |
          Often {} — no extra kwargs.
        rna_loader: |
          { sep: ",", label: "Group" } — REQUIRED for RnaLoader; empty dict causes KeyError.
      when_you_change_it: |
        Mismatch with data_loader choice breaks construction or parsing (CSV vs NPZ).

    init_model:
      description: "Optional initial weights file (basename like model.pt)."
      code_uses: |
        Coordinator only: client_model.load_model(init_path) in Initialization.run()
        when key is set. Other clients do not load here — federated init consistency
        is your responsibility (CONFIG_INCOMPATIBILITIES §9).
      when_you_change_it: |
        Remove or null: training starts from freshly built random weights (then round-0
        broadcast from coordinator in federated mode). Set: warm-start coordinator model.

  # ---------------------------------------------------------------------------
  # simulation — alternate multi-client driver inside one app
  # ---------------------------------------------------------------------------
  simulation:
    section_role: |
      If this key exists and is not null, Initialization.run() returns 'simulation'
      immediately — the standard federated Initialization path (get_dataloader from
      first train file, load_clients_data zip, etc.) is skipped for that branch.

    clients_dir:
      description: "Comma-separated logical client folder names (no spaces in template)."
      code_uses: |
        Simulation.correct_clients_dir() splits the string on "," and sets n_clients;
        train/test paths are injected per client via inject_root_path_to_clients_dir.
      example_value: "c1,c2,c3"
      when_you_change_it: |
        Fewer names → fewer simulated clients. Names must match how your input tree
        is laid out for simulation. Wrong names → missing files.

    pitfalls: |
      Do not assume simulation behaves like production multi-container FeatureCloud.
      Do not enable simulation and expect the same code path as "normal" LocalUpdate
      without reading Simulation.run() in states.py.

  # ---------------------------------------------------------------------------
  # logic — discover data splits (folds)
  # ---------------------------------------------------------------------------
  logic:
    section_role: |
      Tells ConfigState.finalize_config() how to list "splits" (independent data
      partitions, e.g. cross-validation folds).

    mode:
      description: 'directory | file'
      directory: |
        Splits = subdirectories of mnt/input/<logic.dir>/ (each subdir is one fold).
        Example: mnt/input/data/fold0/, fold1/ each containing train.npz & test.npz.
        Every participating client in a real FC run should expose the SAME number of
        fold directories (CONFIG_INCOMPATIBILITIES §10).
      file: |
        Single split root: splits = [input_dir]. All train/test paths are resolved
        relative to that one tree — you do NOT get multiple folds unless your layout
        matches what the code expects (CONFIG_INCOMPATIBILITIES §11).
      when_you_change_it: |
        Switching mode without rearranging folders changes how many models run (1 vs K
        folds) and breaks aggregation if fold counts disagree across clients.

    dir:
      description: "Subfolder under mnt/input scanned in directory mode."
      example: "data"
      when_you_change_it: |
        Points at wrong folder → empty splits or wrong files. Must match where you
        uploaded fold subdirectories.

  # ---------------------------------------------------------------------------
  # result — output basenames per split
  # ---------------------------------------------------------------------------
  result:
    section_role: |
      For each key, finalize_config builds output_files[key] = per-split output paths
      by swapping /input for /output in the split path and appending the basename.

    pred:
      description: "Where predictions are written (e.g. CSV)."
      when_you_change_it: "Downstream scripts expect this name; change only with matching post-processing."

    target:
      description: "Ground-truth / reference file for evaluation outputs."
      when_you_change_it: "Same as pred — keep consistent with evaluation code."

    model:
      description: "Optional DNN checkpoint basename per split."
      when_you_change_it: |
        Omit in minimal configs if you do not need persisted weights. Set to save
        final (or per-round) models depending on WriteResults implementation.

  # ---------------------------------------------------------------------------
  # fed_hyper_params — global federated protocol
  # ---------------------------------------------------------------------------
  fed_hyper_params:
    section_role: |
      Controls how many global rounds run, how many classes the task has, which
      aggregator combines client updates, and which tensor "segments" are included
      in coordinator broadcasts (GlobalUpdates enum in utils/pytorch/utils.py).

    max_iter:
      description: "Maximum number of global communication rounds."
      code_uses: |
        Federated: loop until stoppage or max_iter semantics via FedAvg.post_aggregate
        (with WEIGHTS_STOPPING, stoppage flags include iteration >= max_iter).
        Centralized path reuses max_iter as client_model.model.epochs (states.py).
        Simulation: self.max_iter from same key.
      when_you_change_it: |
        Higher → longer runs, more communication. Too low → underfitting. Too high →
        wasted rounds if early convergence is possible.

    n_classes:
      description: "Class count for classification (model head, metrics, labels)."
      when_you_change_it: |
        Wrong value → shape errors, wrong softmax, or misleading Accuracy. Must match
        dataset label space and trainer.metrics.param.num_classes where applicable.

    federated_model:
      description: 'Aggregator: built-in "FedAvg" string or custom plugin module name.'
      code_uses: |
        Coordinator: utils.get_aggregator(...) instantiates the class; receives
        fed_hyper_params dict merged with train_config for kwargs.
      when_you_change_it: |
        Built-in FedAvg only exposes weights + stoppage for aggregation — NOT gradients
        or config packets. If you set global_updates to GRADIENTS* or *_CONFIG_* with
        built-in FedAvg, the protocol breaks (CONFIG_INCOMPATIBILITIES §2).

    global_updates:
      description: "String name of GlobalUpdates enum member."
      code_uses: |
        load_schemas stores global_update_schema; FedOptimizer.get_global_updates()
        builds the broadcast list (weights, gradients, config, stoppage, CV flags)
        according to this bitmask.
      recommended_for_standard_fedavg: "WEIGHTS_STOPPING"
      why_stopping_matters: |
        Plain WEIGHTS (no STOPPING) may omit stoppage from the packet; then
        all_converged() can fail to terminate on max_iter (CONFIG_INCOMPATIBILITIES §4).
      when_you_change_it: |
        Each variant changes what clients must unpack and what the aggregator must
        produce. Must stay consistent with federated_model capabilities.

    param:
      description: "Extra kwargs passed into the aggregator constructor."
      when_you_change_it: "Only affects custom aggregators that read those keys."

  # ---------------------------------------------------------------------------
  # use_smpc
  # ---------------------------------------------------------------------------
  use_smpc:
    description: "Boolean: request SMPC-style aggregation when supported."
    code_uses: "Stored as smpc_used in shared state; aggregator / ClientModels use it on supported paths."
    when_you_change_it: |
      true without a compatible aggregator/stack → runtime errors or wrong behavior.
      See CONFIG_INCOMPATIBILITIES for SMPC + FedAvg caveats.

  # ---------------------------------------------------------------------------
  # trainer — local learning loop on each client
  # ---------------------------------------------------------------------------
  trainer:
    section_role: |
      Selects the trainer class, what each client sends upstream (LocalUpdates),
      the dataloader plugin, optimizer, loss, and torchmetrics.

    name:
      description: 'e.g. BasicTrainer or plugins/trainers/FedMMb.py'
      code_uses: "utils.get_trainer → class used in build_client_model."
      when_you_change_it: |
        Switches local update logic. FedMMb ignores train_config.epochs and uses
        batch_count instead (CONFIG_INCOMPATIBILITIES §13).

    param:
      description: "Forwarded as **kwargs into the trainer constructor."
      when_you_change_it: "Plugin-specific."

    local_updates:
      description: "LocalUpdates enum name — what the client packs (weights, grads, n_samples, CV)."
      code_uses: "load_schemas → local_update_schema; ClientModels.get_local_updates obeys it."
      fedavg_typical: "WEIGHTS_N_SAMPLES"
      when_you_change_it: |
        WEIGHTS only (no sample counts) with FedAvg averaging is invalid (§3).
        GRADIENTS-based modes need aggregators and models that actually provide gradients.

    data_loader:
      description: "Dataloader plugin: ImageLoader, ImageLoader.py, RnaLoader.py, etc."
      code_uses: "utils.get_dataloader → class; first arg sample path, then **detail."
      when_you_change_it: |
        Must match file types under local_dataset.train/test. RnaLoader needs CSV/TSV
        + detail; ImageLoader expects npz/npy patterns.

    optimizer:
      name:
        description: "torch.optim class or custom optimizer plugin."
        code_uses: "Resolved in get_custom_modules; passed into trainer attributes."
      param:
        description: "Optimizer hyperparameters (lr, momentum, ...)."
      when_you_change_it: |
        Very large lr → divergence; very small → slow learning. Keep mentally in sync
        with train_config.lr if your trainer reads both.

    loss:
      name:
        description: "torch.nn loss or custom loss plugin (e.g. focal_loss.py)."
      param:
        description: "Constructor kwargs for the loss (e.g. focal alpha/gamma)."
      when_you_change_it: |
        Must match model output (logits vs log_softmax) — CONFIG_INCOMPATIBILITIES §6.

    metrics:
      description: "List of {name, package, param} for torchmetrics or custom metrics."
      code_uses: "Instantiated in get_custom_modules; updated during train/test steps."
      when_you_change_it: |
        task and num_classes must match your problem (multiclass vs binary, etc.).

  # ---------------------------------------------------------------------------
  # train_config — batching, epochs, device
  # ---------------------------------------------------------------------------
  train_config:
    section_role: |
      Passed into the trainer / model as train_config; device is normalized via
      utils.set_device. batch sizes flow into dl.load(...).

    verbose:
      description: "More logging when true."
      when_you_change_it: "Noise vs debug visibility."

    batch_size:
      description: "Training minibatch size passed to dl.load for train loaders."
      when_you_change_it: |
        Larger → faster training but more VRAM/RAM; OOM → reduce. Affects gradient noise.

    test_batch_size:
      description: "Batch size for test / central eval loaders."
      when_you_change_it: "Mostly memory / speed; does not change task definition."

    epochs:
      description: "Local epochs per round (for trainers that honor it)."
      when_you_change_it: |
        More epochs → heavier local work per global round. Ignored by FedMMb fit loop
        (uses batch_count there).

    lr:
      description: "Top-level learning rate; some code paths read this in addition to optimizer.param."
      when_you_change_it: "Inconsistent lr vs optimizer.param.lr can confuse debugging — align them unless you know the trainer uses only one."

    batch_count:
      description: "Used by some trainers (e.g. FedMMb) to cap batches per local update."
      when_you_change_it: "Low value → very short local training per round."

    device:
      description: '"cpu" | "gpu"'
      code_uses: "Normalized in build_client_model; CUDA used if available when gpu requested."
      when_you_change_it: |
        gpu without GPU → fallback or error depending on set_device. cpu is safest for portability.

  # ---------------------------------------------------------------------------
  # model — neural architecture
  # ---------------------------------------------------------------------------
  model:
    section_role: |
      Passed to utils.design_architecture with a sample dataloader to build the
      network (custom .py plugin, built-in name, or layer list per README).

    name:
      description: 'cnn.py, mlp.py, built-in CNN string, etc.'
      when_you_change_it: |
        Changes capacity, inductive bias, and parameter count. Must remain compatible
        with input shapes from the dataloader and with loss/metrics (e.g. classification head).

    n_classes:
      description: "Output dimension / class count for the head."
      when_you_change_it: "Must match labels and fed_hyper_params.n_classes / metrics."

    in_features:
      description: "Model input feature hint (semantics depend on specific model file)."
      when_you_change_it: |
        Wrong value → shape mismatch on first forward. Tabular vs image models interpret
        this differently — check your model plugin.

# =============================================================================
# Scenario cheat sheet (narrative)
# =============================================================================
scenarios:
  more_federated_rounds: |
    Raise fed_hyper_params.max_iter. Ensure global_updates includes STOPPING if you
    rely on coordinator stoppage for clean termination (WEIGHTS_STOPPING).

  switch_architecture: |
    Change model.name (e.g. cnn.py → mlp.py). Reconcile n_classes, in_features, and
    verify loss vs final activation.

  tabular_rna: |
    local_dataset: CSV names + detail.sep/label; trainer.data_loader: RnaLoader.py;
    model/loss appropriate for tabular classification — not default image CNN.

  single_fold_debug: |
    logic.mode: file (or one fold only), lower max_iter and epochs, smaller batch_size
    if memory is tight.

  avoid_simulation_confusion: |
    Remove simulation block entirely for standard FeatureCloud multi-container tests
    unless you intentionally use Simulation.run().

# =============================================================================
# Enum reference (string values must match exactly)
# =============================================================================
enums:
  GlobalUpdates_examples:
    - WEIGHTS
    - WEIGHTS_STOPPING
    - WEIGHTS_CROSS_VALIDATION
    - "… see utils/pytorch/utils.py GlobalUpdates for full list"
  LocalUpdates_examples:
    - WEIGHTS
    - WEIGHTS_N_SAMPLES
    - GRADIENTS_N_SAMPLES
    - "… see utils/pytorch/utils.py LocalUpdates for full list"
