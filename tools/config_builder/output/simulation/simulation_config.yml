# execution mode: simulation
fc_deep:
  simulation:
    clients_dir: c1, c2
  local_dataset:
    train: train.npz
    test: test.npz
    central_test: null
    detail: {}
  logic:
    mode: directory
    dir: data
  result:
    pred: y_pred.csv
    target: y_test.csv
    model: model.pt
  fed_hyper_params:
    max_iter: 5
    n_classes: 10
    federated_model: plugins/aggregators/FedAvg.py
    global_updates: WEIGHTS_STOPPING
    param: {}
  use_smpc: false
  trainer:
    name: plugins/trainers/FedMMb.py
    param: {}
    local_updates: WEIGHTS_N_SAMPLES
    data_loader: plugins/dataloaders/ImageLoader.py
    optimizer:
      name: SGD
      param:
        lr: 0.1
    loss:
      name: plugins/loss/focal_loss.py
      param: {}
    metrics:
    - name: Accuracy
      package: torchmetrics.classification
      param:
        task: multiclass
        num_classes: 10
  train_config:
    verbose: false
    batch_size: 32
    test_batch_size: 32
    epochs: 1
    lr: 0.1
    batch_count: 1
    device: cpu
  model:
    name: plugins/models/cnn.py
    n_classes: 10
    in_features: 1
