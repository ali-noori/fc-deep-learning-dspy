# Centralized mode — partial template (defaults filled; plugin/data fields left empty).
# Reference: data/sample_data_centralized/mnist/generic/config.yml
# Requires `centralized`. Do not set `simulation`.

fc_deep:
  centralized: true

  local_dataset:
    train:
    test:
    central_test: null
    detail: {}

  logic:
    mode: "directory"
    dir:

  result:
    pred: "y_pred.csv"
    target: "y_test.csv"
    model: "model.pt"

  fed_hyper_params:
    max_iter: 10
    n_classes:
    federated_model:
    global_updates: WEIGHTS_STOPPING
    param: {}

  use_smpc: false

  trainer:
    name:
    param: {}
    local_updates: WEIGHTS_N_SAMPLES
    data_loader:
    optimizer:
      name: "SGD"
      param:
        lr: 0.1
    loss:
      name:
      param: {}
    metrics:
      - name: "Accuracy"
        package: "torchmetrics.classification"
        param:
          task: "multiclass"
          num_classes:

  train_config:
    verbose: false
    batch_size: 32
    test_batch_size: 32
    epochs: 1
    lr: 0.1
    batch_count: 1
    device: cpu

  model:
    name:
    n_classes:
    in_features:
